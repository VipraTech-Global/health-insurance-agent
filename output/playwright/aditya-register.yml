      - paragraph [ref=f8e854]:
        - text: "Aditya Birla Health Insurance Co. Limited. IRDAI Reg.153. CIN No. U66000MH2015PLC263677. Registered Office Address: 9th Floor, Tower 1, One World Centre, Jupiter Mills Compound, 841, Senapati Bapat Marg, Elphinstone Road, Mumbai 400013. Email:"
        - link "care.healthinsurance@adityabirlacapital.com" [ref=f8e855] [cursor=pointer]:
          - /url: mailto:care.healthinsurance@adityabirlacapital.com
        - text: ", Website:"
        - link "www.adityabirlahealthinsurance.com" [ref=f8e856] [cursor=pointer]:
          - /url: https://www.adityabirlahealthinsurance.com/
        - text: ", Telephone:"
        - link "1800 270 7000" [ref=f8e857] [cursor=pointer]:
          - /url: tel:1800-270-7000
        - text: ". Trademark/Logo Aditya Birla Capital is owned by Aditya Birla Management Corporation Private Limited and Trademark/logo HealthReturnsTM, Healthy Heart ScoreTM and Active DayzTM are owned by Momentum Group Ltd (MGL) (Formerly known as Momentum Metropolitan Life Limited). These trademark/Logos are being used by Aditya Birla Health Insurance Co. Limited under licensed user agreement(s). For more details on risk factors, terms and conditions please read policy wordings carefully before concluding a sale. Product and Product UIN: Activ One, ADIHLIP24097V012324. Activ Health, ADIHLIP24102V052324. Ekam Suraksha, ADIHLIP23203V012223. Activ Assure, ADIHLIP24175V052324. Activ Fit, ADIHLIP22008V012223. OPD Add-on, ADIHLIA22212V012122. ABHI Protect Add-on, ADIHLIA22218V012122. Health Add-ons, ADIHLIA22177V012122. Saral Suraksha Bima, ADIPAIP21628V012021. Activ Care, ADIHLIP21062V022021. Super Health Plus Top up, ADIHLIP21061V022021. Global Health Secure, ADIHLIP21069V022021. Arogya Sanjeevani Policy, ADIHLIP20170V011920. Corona Kavach Policy, ADIHLIP21080V012021. Corona Rakshak Policy, ADIHLIP21136V012021. Activ Secure, ADIHLIP18076V011718. Aditya Birla Health Insurance Co. Ltd, Antyodaya Shramik Suraksha Yojana, ADIPAGP24071V012324. Group Active Secure, ADIHLGP23155V032223. Group Travel Protect, ADITGBP23002V012223. Group Activ Health, ADIHLGP22190V032122. Group Protect, ADIHLGP22023V032122. Group Activ Travel, ADITGBP21600V032021. Group Activ Health_Additional S.I. for Pandemic and epidemic Rider, ADIHLAP21589V012021. Group Activ Health_Super Reload Rider, ADIHLAP21588V012021. Group Activ Health_Tele OPD Consultation Rider, ADIHLAP21590V012021. Group Activ Health_Super No Claim Bonus Rider, ADIHLAP21591V012021. Group Assure COVID-19, ADIHLGP21055V012021. Group Arogya Sanjeevani Policy, ADIHLGP21229V012021. Health Booster, ADIHLIA25035V012425. HLTH Meter, ADIHLIA24176V012324. For more details on risk factor, terms and conditions please refer policy wordings and prospectus before concluding a sale. Premium may vary as per plan opted and underwriting norms. Tax benefits are subject to changes in tax laws. 0% GST is appliable for individual & family floater health insurance policies. Category of Certificate: Health Insurance. Validity of Certificate of Registration: In Force. Claim Settlement Ratio pertains to FY 24 – 25. Quick claim processing depends upon the receipt of complete set of documents by the claimant. The amount of HealthReturns™ are indicative. Each Insured Person would be tracked separately and shall earn HealthReturns™ based on individual performance as per grid of Healthy Heart Score™ and Active Dayz™."
